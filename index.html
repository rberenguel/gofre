<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Gofre</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="fonts/iconoir/iconoir.css" />
    <link rel="stylesheet" href="fonts/inter.css" />
    <link rel="manifest" href="manifest.json" />
    <style></style>
  </head>
  <body>
    <div id="app-container">
      <div id="start-screen">
        <img src="icon.png" alt="Gofre Game Icon" id="splash-icon" />
        <h1>Gofre</h1>
        <p>A test of selective attention.</p>
        <div class="start-actions">
          <button id="start-btn">Start</button>
          <button id="help-btn">?</button>
        </div>
      </div>

      <div id="help-overlay" class="hidden">
        <div class="help-content">
          <h2>How to Play</h2>
          <p>
            You will see colored shapes and a number for a few seconds. After
            they disappear, you will be asked a question about what you saw.
          </p>
          <p>Your goal is to answer as quickly and accurately as possible.</p>
          <button id="close-help-btn">Got It</button>
        </div>
      </div>

      <div id="game-screen-wrapper" class="hidden">
        <div id="info-panel">
          <span><span id="round-counter">0 / 20</span></span>
        </div>
        <div id="game-screen">
          <canvas id="stroopCanvas"></canvas>
          <div id="feedback-icon-container"></div>
        </div>
        <div id="number-pad"></div>
      </div>

      <div id="results-screen" class="hidden">
        <h2>Results</h2>
        <div id="results-table-container"></div>
        <div class="results-actions">
          <button id="copy-btn">Copy for Obsidian</button>
          <button id="restart-btn">Play Again</button>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(
            function (registration) {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope,
              );
            },
            function (err) {
              console.log("ServiceWorker registration failed: ", err);
            },
          );
        });
      } else {
        console.info("Service workers not available on this device");
      }
    </script>
  </body>
</html>
